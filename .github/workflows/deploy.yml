name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 手動実行もできるようにしておく（Actions タブ → このワークフロー → Run workflow）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限。進行中のデプロイは中断せず待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          # https://hk8787.github.io/itsaiyou/ で配信されるため、
          # リポジトリ名をベースパスに指定する。
          #
          # 独自ドメインを繋いだら（例 https://zeroichi-it.com ）、
          # ルート配信になるのでこの行を BASE_PATH: "" に変えること。
          BASE_PATH: /itsaiyou
          # 相談フォームの送信先（Google Apps Script のウェブアプリURL）。
          # リポジトリの Settings → Secrets and variables → Actions → Variables で
          # FORM_ENDPOINT を登録すると有効になる。未登録なら送信せず、
          # LINE貼り付け用テキストの生成のみになる。
          # 手順: docs/marketing/form-setup.md
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          # Google Search Console の所有権確認トークン。
          # 同じく Variables に GOOGLE_SITE_VERIFICATION を登録すると、
          # 全ページの <head> に meta タグが出る。未登録なら何も出力しない。
          # 手順: docs/marketing/search-console.md
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      # Pages は既定で Jekyll 処理を挟まないが、念のため無効化しておく
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
