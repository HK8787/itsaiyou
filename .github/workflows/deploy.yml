name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 手動実行もできるようにしておく（Actions タブ → このワークフロー → Run workflow）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限。進行中のデプロイは中断せず待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          # https://hk8787.github.io/itsaiyou/ で配信されるため、
          # リポジトリ名をベースパスに指定する。
          #
          # 独自ドメインを繋いだら（例 https://zeroichi-it.com ）、
          # ルート配信になるのでこの行を BASE_PATH: "" に変えること。
          BASE_PATH: /itsaiyou
        run: npm run build

      # Pages は既定で Jekyll 処理を挟まないが、念のため無効化しておく
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
